name = "atp-revamp"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare Pages build settings ──────────────────────────
# Framework:        Next.js
# Build command:    next build
# Output directory: .next
# Node version:     20

# ── Environment variables ─────────────────────────────────────
# Add secret vars (RESEND_API_KEY, GOOGLE_SHEETS_LEADS_WEBHOOK_URL, etc.)
# via the Cloudflare Pages dashboard → Settings → Environment variables.
# Non-secret NEXT_PUBLIC_* vars can go here:

[vars]
NEXT_PUBLIC_SITE_URL = "https://authorstranquilitypress.com"
NEXT_PUBLIC_SANITY_DATASET = "production"
